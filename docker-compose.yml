name: sky-takeout-ai
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set an independent container root password}
      MYSQL_DATABASE: sky_takeout_ai
      MYSQL_USER: sky_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set the container app database password}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      # 显式顺序，避免02_seed_demo_data按文件名排在建表脚本之前。
      - ./sql/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql:ro
      - ./sql/02_auth.sql:/docker-entrypoint-initdb.d/02_auth.sql:ro
      - ./sql/03_catalog.sql:/docker-entrypoint-initdb.d/03_catalog.sql:ro
      - ./sql/04_setmeal.sql:/docker-entrypoint-initdb.d/04_setmeal.sql:ro
      - ./sql/05_cart.sql:/docker-entrypoint-initdb.d/05_cart.sql:ro
      - ./sql/06_orders.sql:/docker-entrypoint-initdb.d/06_orders.sql:ro
      - ./sql/02_seed_demo_data.sql:/docker-entrypoint-initdb.d/90_seed_demo_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D sky_takeout_ai -e 'SELECT 1 FROM employee LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: sky_app
      DB_PASSWORD: ${DB_PASSWORD:?Set the container app database password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_ENABLED: "true"
      AI_MODE: ${AI_MODE:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-flash}
      JWT_SECRET: ${JWT_SECRET:?Set a Base64 encoded random key of at least 32 bytes}
      TZ: Asia/Shanghai
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthProbe"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
  frontend:
    build:
      context: .
      dockerfile: sky-web/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-18088}:80"
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
# Compose项目名给volume和network加命名空间；不挂载宿主MySQL目录，不发布3306/6379。
volumes:
  mysql_data:
